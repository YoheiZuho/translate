services:
  translate:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://vllm:8000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-tencent/Hy-MT2-7B}
      # Hy-MT2-7B recommended params (change for 30B-A3B: top_p=1.0, top_k=-1, rep_penalty=1.0)
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_TOP_P=${LLM_TOP_P:-0.6}
      - LLM_TOP_K=${LLM_TOP_K:-20}
      - LLM_REPETITION_PENALTY=${LLM_REPETITION_PENALTY:-1.05}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - API_KEY=${API_KEY:-}
      - LANGUAGES=${LANGUAGES:-}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3